# 마우스를 이용해 pane 크기 조절
set -g mouse on

# 스크롤백 버퍼 줄 수 (기본값 2000)
# - 새로 만드는 pane부터 적용됨. 기존 pane은 다시 열어야 반영된다
set -g history-limit 50000

# ESC 키 입력 지연 제거
# - 기본값 500ms라 vim에서 ESC를 누르면 느리게 반응한다
set -sg escape-time 10

# 창/pane 번호를 1부터 시작 (키보드 숫자 배치와 맞춤)
set -g base-index 1
setw -g pane-base-index 1

# 창을 닫으면 번호를 다시 매겨 빈 번호를 남기지 않는다
set -g renumber-windows on

# 열려있는 모든 pane에 동시 입력 설정 key bind
bind-key y set-window-option synchronize-panes

# 분할 시 현재 pane의 작업 디렉토리를 유지 (기본 바인딩 %, " 도 그대로 사용 가능)
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# 정렬
bind-key h select-layout even-horizontal
bind-key v select-layout even-vertical
bind-key t select-layout tiled
